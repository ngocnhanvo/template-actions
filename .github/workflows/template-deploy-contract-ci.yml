name: Template deploy transport contracts (NO BUILD OR FTP)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/template-production-deploy.yml'
      - '.github/workflows/template-php-release.yml'
      - '.github/workflows/template-deploy-contract-ci.yml'
      - 'scripts/template-*-delta-package.py'
      - 'scripts/template-remote-unzip.py'
      - 'scripts/template-resumable-ftp.sh'
      - 'scripts/template-php-live-release.py'
      - 'tests/template-*.test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Template PHP contract source (no deployment)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/template-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-php
          persist-credentials: false
      - name: PHP syntax and signed staging reconstruction contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l source-php/template-unzip.php
          php -l source-php/template-image-delta.php
          php source-php/tests/template-image-delta.php
          php source-php/tests/template-static-delta.php
      - name: Python packaging, compatibility and ZIP roundtrip contracts
        shell: bash
        env:
          TEMPLATE_PHP_SOURCE: source-php
        run: |
          set -euo pipefail
          command -v php
          bash -n scripts/template-resumable-ftp.sh
          for test in tests/template-*.test.py; do
            python3 "$test" -v
          done
